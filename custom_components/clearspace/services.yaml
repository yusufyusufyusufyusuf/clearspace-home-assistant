create_task:
  name: Create task
  description: Create a task in ClearSpace.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Target a specific ClearSpace account.
      selector:
        text:
    entity_prefix:
      name: Entity prefix
      description: Optional. Target the account with this prefix.
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:
    due:
      name: Due date
      selector:
        date:
    priority:
      name: Priority
      default: medium
      selector:
        select:
          options: [low, medium, high, urgent]
    space_id:
      name: Space ID
      selector:
        text:
    description:
      name: Description
      selector:
        text:
          multiline: true
